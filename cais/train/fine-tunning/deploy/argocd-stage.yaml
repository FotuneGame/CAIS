apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cais-fine-tuning-stage
  namespace: cicd
spec:
  project: default
  source:
    repoURL: http://gitlab-webservice-default.vcs.svc.cluster.local:8181/main/cais-fine-tuning.git
    targetRevision: main
    path: deploy
    helm:
      valueFiles: [values.yaml, values-stage.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: app-stage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
