keycloak:
  httpRelativePath: /stage/keycloak/
  externalDatabase:
    host: postgresql.db-stage.svc.cluster.local

oauth2-proxy:
  extraArgs:
    proxy-prefix: /stage/oauth2
    redirect-url: https://platform.local/stage/oauth2/callback
    oidc-issuer-url: https://platform.local/stage/keycloak/realms/master
    login-url: https://platform.local/stage/keycloak/realms/master/protocol/openid-connect/auth
    redeem-url: http://keycloak.acl-stage.svc.cluster.local:8080/stage/keycloak/realms/master/protocol/openid-connect/token
    oidc-jwks-url: http://keycloak.acl-stage.svc.cluster.local:8080/stage/keycloak/realms/master/protocol/openid-connect/certs
    extra-jwt-issuers: https://platform.local/stage/keycloak/realms/master=cais-ui,http://keycloak.acl-stage.svc.cluster.local:8080/stage/keycloak/realms/master=cais-ui
    cookie-name: _oauth2_stage
