llama:
  image:
    repository: ghcr.io/ggml-org/llama.cpp
    tag: server
  model:
    repository: unsloth/Qwen3.5-4B-GGUF
    name: Qwen3.5-4B
    quantization: Q4_K_M
  storage: 20Gi
  contextSize: 32768
  thinking: false
  # Кеш запросов в RAM (llama.cpp по умолчанию 8 ГиБ) должен помещаться в лимит памяти пода.
  cacheRamMiB: 512
  ctxCheckpoints: 4
  apiPrefix: ""
  resources:
    requests: { cpu: 750m, memory: 3Gi }
    limits: { memory: 4608Mi }
  gpu:
    enabled: false
    memoryMiB: 0
    # auto — столько слоёв, сколько помещается в свободную VRAM (llama.cpp --fit).
    layers: auto
    fitTargetMiB: 256
    imageTag: server-cuda
