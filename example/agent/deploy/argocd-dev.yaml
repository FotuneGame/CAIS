apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agent-dev
  namespace: cicd
spec:
  project: default
  source:
    repoURL: http://gitlab-webservice-default.vcs.svc.cluster.local:8181/main/agent.git
    targetRevision: main
    path: deploy
    helm:
      valueFiles: [values.yaml, values-dev.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: app-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
