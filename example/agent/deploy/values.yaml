image: registry.local/main/agent
imagePullSecret: gitlab-registry
replicas: 1
dataDir: agent
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { memory: 256Mi }

env:
  APP_DATA_PATH: /app-data
  PUBLIC_URL: http://agent.app-{{ .Values.stage }}.svc.cluster.local
  POSTGRES_HOST: postgresql.db-{{ .Values.stage }}.svc.cluster.local
  KAFKA_BROKERS: kafka.mb-{{ .Values.stage }}.svc.cluster.local:9092
  KEYCLOAK_ISSUERS: https://platform.local/{{ .Values.stage }}/keycloak/realms/master,http://keycloak.acl-{{ .Values.stage }}.svc.cluster.local:8080/{{ .Values.stage }}/keycloak/realms/master
  KEYCLOAK_JWKS_URL: http://keycloak.acl-{{ .Values.stage }}.svc.cluster.local:8080/{{ .Values.stage }}/keycloak/realms/master/protocol/openid-connect/certs
  LLM_URL: http://llama.llm-{{ .Values.stage }}.svc.cluster.local:8080/{{ .Values.stage }}/llama

secretEnv:
  POSTGRES_USER: { secret: postgresql-credentials, key: username }
  POSTGRES_DB: { secret: postgresql-credentials, key: username }
  POSTGRES_PASSWORD: { secret: postgresql-credentials, key: password }
